name: ai-sre-copilot

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  restart: unless-stopped
  networks: [ai-sre]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_sre
      POSTGRES_USER: ai_sre
      POSTGRES_PASSWORD: ai_sre
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_sre -d ai_sre"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [ai-sre]

  kafka:
    image: apache/kafka:4.2.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT_DOCKER://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports: ["9092:9092"]
    networks: [ai-sre]

  chromadb:
    image: chromadb/chroma:1.0.20
    volumes: [chroma_data:/data]
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    ports: ["8002:8000"]
    networks: [ai-sre]

  ollama:
    image: ollama/ollama:0.11.10
    volumes: [ollama_data:/root/.ollama]
    ports: ["11434:11434"]
    networks: [ai-sre]

  model-init:
    image: curlimages/curl:8.15.0
    depends_on: [ollama]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until curl -sf http://ollama:11434/api/tags >/dev/null; do sleep 2; done;
        curl -f http://ollama:11434/api/pull
        -H 'Content-Type: application/json'
        -d '{"name":"qwen3:4b","stream":false}'
    networks: [ai-sre]

  backend:
    <<: *app
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 15

  mcp-server:
    <<: *app
    command: ["python", "-m", "mcp_server.server"]
    depends_on:
      postgres: {condition: service_healthy}
      backend: {condition: service_healthy}
    ports: ["8001:8001"]

  worker:
    <<: *app
    command: ["python", "-m", "worker.main"]
    depends_on:
      backend: {condition: service_healthy}
      mcp-server: {condition: service_started}
      rag-init: {condition: service_completed_successfully}
      model-init: {condition: service_completed_successfully}

  rag-init:
    <<: *app
    command: ["python", "-c", "from backend.seed import seed_database; print(seed_database(index_rag=True))"]
    restart: "no"
    depends_on:
      backend: {condition: service_healthy}
      chromadb: {condition: service_started}

  frontend:
    <<: *app
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://backend:8000
      DEMO_MODE: "false"
    depends_on:
      backend: {condition: service_healthy}
    ports: ["8501:8501"]

  kafka-seed:
    <<: *app
    command: ["python", "-m", "simulator.publisher"]
    restart: "no"
    depends_on:
      kafka: {condition: service_started}
      backend: {condition: service_healthy}

networks:
  ai-sre:

volumes:
  postgres_data:
  chroma_data:
  ollama_data:
